<main class="graph-page">
  <header class="page-header">
    <div>
      <p class="eyebrow">Maze / topology</p>
      <h1>Room map</h1>
    </div>
    <p class="graph-summary">45 rooms · 137 connections</p>
  </header>

  <section class="graph-frame" aria-label="Room connection graph">
    <svg #graph role="img" aria-label="A graph showing rooms and their connections"></svg>
    @if (isLoading()) {
      <p class="graph-message">Loading room map...</p>
    }
    @if (errorMessage()) {
      <p class="graph-message error" role="alert">{{ errorMessage() }}</p>
    }
  </section>
</main>
